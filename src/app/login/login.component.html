<div class="login-container">
    <div class="login-card">
        <div class="logo-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <!-- Bulb Dome -->
                <path d="M9 10a3 3 0 1 1 6 0c0 1.5-1 2.5-1.5 3.5h-3C10 12.5 9 11.5 9 10z"></path>
                <line x1="10" y1="16" x2="14" y2="16"></line>
                <line x1="11" y1="18" x2="13" y2="18"></line>
                <!-- Sunburst Rays -->
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="19.78" y1="4.22" x2="18.36" y2="5.64"></line>
                <line x1="2" y1="10" x2="4" y2="10"></line>
                <line x1="20" y1="10" x2="22" y2="10"></line>
            </svg>
        </div>

        <h2>Welcome to Vyasa AI</h2>
        <p class="subtitle">
            Enter your email address to access your interview session history.
        </p>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
                <label for="name">NAME</label>
                <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Enter your name" required
                    autocomplete="email" />
                <div class="error-text" *ngIf="errorMessage">
                    {{ errorMessage }}
                </div>
            </div>
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="name@example.com" required
                    autocomplete="email" />
                <div class="error-text" *ngIf="errorMessage">
                    {{ errorMessage }}
                </div>
            </div>

            <button type="submit" class="btn-submit">Lets go!</button>
        </form>
    </div>
</div>
